name: Extra tests (perf + balance)

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Which suite to run
        type: choice
        default: both
        options: [both, perf, balance]

permissions:
  contents: read

concurrency:
  group: extra-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf:
    if: inputs.suite == 'both' || inputs.suite == 'perf'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:perf

  balance:
    if: inputs.suite == 'both' || inputs.suite == 'balance'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:balance
