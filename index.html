    <title>Play Slope Tycoon – ski &amp; mountain resort game</title>
    <style>
      /* Boot splash: static (same mark as src/ui/logo.ts), removed by main.ts (hideSplash); never blocks input once done. */
      /* Very subtle vignette (static CSS, no perf cost): under the HUD (#ui is z 22), above the canvas. */
      body::after { content: ''; position: fixed; inset: 0; z-index: 21; pointer-events: none; background: radial-gradient(ellipse at 50% 48%, rgba(0,0,0,0) 64%, rgba(12,22,42,.12) 100%); }
      #splash { position: fixed; inset: 0; z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: linear-gradient(#244a82, #12233f); color: #dbe6f6; font: 700 15px/1 'Nunito', system-ui, sans-serif; transition: opacity .35s; }
      #splash svg { width: 96px; height: 96px; filter: drop-shadow(0 6px 16px rgba(0,0,0,.5)); }
      #splash b { font: 400 30px/1 'Lilita One', 'Nunito', system-ui, sans-serif; color: #fff; letter-spacing: .5px; }
      #splash.done { opacity: 0; pointer-events: none; }
      #splash .dots::after { content: ''; animation: sd 1.2s steps(4, end) infinite; } @keyframes sd { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
    </style>
  </head>
  <body>
    <noscript><p style="position:relative;z-index:300;padding:24px;font:16px sans-serif;color:#fff;background:#1d3b6e">Slope Tycoon is a free ski and mountain resort tycoon game that runs in your browser. It needs JavaScript and WebGL. Nothing is tracked without JavaScript. <a style="color:#ffd070" href="../">Back to the Slope Tycoon website</a>.</p></noscript>
    <div id="app"></div>
    <div id="ui"></div>
    <div id="splash" role="status" aria-live="polite"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Slope Tycoon" class="logo logo-mark"><title>Play Slope Tycoon – ski &amp; mountain resort game</title><defs><linearGradient id="sp-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f86c6"/><stop offset="1" stop-color="#1d3b6e"/></linearGradient><linearGradient id="sp-t1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfe3f7"/></linearGradient><linearGradient id="sp-t2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd070"/><stop offset="1" stop-color="#e0902a"/></linearGradient></defs><rect width="100" height="100" rx="22" fill="url(#sp-sky)"/><circle cx="71" cy="29" r="11" fill="#ffd070"/><path d="M44 82 L72 40 L100 82 Z" fill="#6f93c4"/><path d="M72 40 L63.5 53 L68 50.5 L72 55 L76.5 50.5 L80.5 53 Z" fill="#ffffff"/><path d="M-2 84 L36 22 L74 84 Z" fill="#3f649a"/><path d="M36 22 L74 84 L50 84 L40 52 Z" fill="#2d4c7d" opacity=".55"/><path d="M36 22 L24.5 41 L30 38 L36 44 L42 37.5 L48 41 Z" fill="#ffffff"/><path d="M36 40 C 30 52, 48 56, 40 66 C 35 72, 25 74, 20 84" fill="none" stroke="#ffb23e" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="0.1 6.2"/><path d="M36 40 C 30 52, 48 56, 40 66 C 35 72, 25 74, 20 84" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity=".92"/></svg><b>Slope Tycoon</b><span>Loading<span class="dots"></span></span></div>
    <script>
      if (location.protocol === 'file:') {
        document.addEventListener('DOMContentLoaded', function () {
          var el = document.getElementById('app') || document.body;
          el.textContent = 'Slope Tycoon cannot run from file://. Run "npm run preview" (or "npx serve dist") and open the printed http://localhost URL.';
          el.style.cssText = 'padding:24px;font:16px sans-serif;color:#fff;background:#222';
        });
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
