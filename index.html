    <title>Play Slope Tycoon – ski &amp; mountain resort game</title>
    <style>
      /* Boot splash: static (same mark as src/ui/logo.ts), removed by main.ts (hideSplash); never blocks input once done. */
      /* Very subtle vignette (static CSS, no perf cost): under the HUD (#ui is z 22), above the canvas. */
      body::after { content: ''; position: fixed; inset: 0; z-index: 21; pointer-events: none; background: radial-gradient(ellipse at 50% 48%, rgba(0,0,0,0) 64%, rgba(12,22,42,.12) 100%); }
      #splash { position: fixed; inset: 0; z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: linear-gradient(#244a82, #12233f); color: #dbe6f6; font: 700 15px/1 'Nunito', system-ui, sans-serif; transition: opacity .35s; }
      #splash svg { width: 96px; height: 96px; filter: drop-shadow(0 6px 16px rgba(0,0,0,.5)); }
      #splash b { font: 400 30px/1 'Lilita One', 'Nunito', system-ui, sans-serif; color: #fff; letter-spacing: .5px; }
      #splash.done { opacity: 0; pointer-events: none; }
      #splash .dots::after { content: ''; animation: sd 1.2s steps(4, end) infinite; } @keyframes sd { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
      #splash .sp-bar { width: min(260px, 70vw); height: 6px; border-radius: 3px; background: rgba(255,255,255,.16); overflow: hidden; position: relative; margin-top: 6px; }
      #splash .sp-bar[hidden] { display: none; }
      #splash .sp-fill { height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, #ffd070, #ffb23e); transition: width .35s ease-out; }
      #splash .sp-bar.ind .sp-fill { position: absolute; width: 35%; animation: sp-ind 1.3s ease-in-out infinite; }
      @keyframes sp-ind { 0% { left: -35%; } 100% { left: 100%; } }
      #splash .sp-text { display: block; min-height: 1.2em; text-align: center; }
      #splash .sp-hint { display: block; min-height: 3.2em; max-width: min(340px, 86vw); text-align: center; font-weight: 600; font-size: 13px; line-height: 1.35; color: #a9bcd9; }
      #splash .sp-hint[hidden] { visibility: hidden; display: block; }
      #splash .sp-err { position: absolute; left: 0; right: 0; bottom: 12%; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 0 24px; text-align: center; }
      #splash .sp-err[hidden] { display: none; }
      #splash .sp-err p { margin: 0; max-width: 420px; font: 600 14px/1.4 'Nunito', system-ui, sans-serif; color: #ffd9d0; }
      #splash .sp-err button { min-height: 44px; padding: 0 22px; border: 0; border-radius: 10px; background: #ffd070; color: #1d2b44; font: 800 15px 'Nunito', system-ui, sans-serif; cursor: pointer; }
      @media (prefers-reduced-motion: reduce) { #splash, #splash .sp-fill { transition: none; } #splash .sp-bar.ind .sp-fill { animation: none; left: 0; width: 100%; opacity: .5; } #splash .dots::after { animation: none; } }
    </style>
  </head>
  <body>
    <noscript><p style="position:relative;z-index:300;padding:24px;font:16px sans-serif;color:#fff;background:#1d3b6e">Slope Tycoon is a free ski and mountain resort tycoon game that runs in your browser. It needs JavaScript and WebGL. Nothing is tracked without JavaScript. <a style="color:#ffd070" href="../">Back to the Slope Tycoon website</a>.</p></noscript>
    <div id="app"></div>
    <div id="ui"></div>
    <div id="splash"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Slope Tycoon" class="logo logo-mark"><title>Play Slope Tycoon – ski &amp; mountain resort game</title><defs><linearGradient id="sp-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f86c6"/><stop offset="1" stop-color="#1d3b6e"/></linearGradient><linearGradient id="sp-t1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfe3f7"/></linearGradient><linearGradient id="sp-t2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd070"/><stop offset="1" stop-color="#e0902a"/></linearGradient></defs><rect width="100" height="100" rx="22" fill="url(#sp-sky)"/><circle cx="71" cy="29" r="11" fill="#ffd070"/><path d="M44 82 L72 40 L100 82 Z" fill="#6f93c4"/><path d="M72 40 L63.5 53 L68 50.5 L72 55 L76.5 50.5 L80.5 53 Z" fill="#ffffff"/><path d="M-2 84 L36 22 L74 84 Z" fill="#3f649a"/><path d="M36 22 L74 84 L50 84 L40 52 Z" fill="#2d4c7d" opacity=".55"/><path d="M36 22 L24.5 41 L30 38 L36 44 L42 37.5 L48 41 Z" fill="#ffffff"/><path d="M36 40 C 30 52, 48 56, 40 66 C 35 72, 25 74, 20 84" fill="none" stroke="#ffb23e" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="0.1 6.2"/><path d="M36 40 C 30 52, 48 56, 40 66 C 35 72, 25 74, 20 84" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity=".92"/></svg><b>Slope Tycoon</b><div id="splash-bar" class="sp-bar ind" role="progressbar" aria-label="Loading Slope Tycoon" aria-valuemin="0" aria-valuemax="100"><div id="splash-fill" class="sp-fill"></div></div><span id="splash-text" class="sp-text" aria-live="polite">Loading…</span><span id="splash-hint" class="sp-hint" aria-live="polite" hidden></span><div id="splash-err" class="sp-err" role="alert" hidden><p></p><button type="button" onclick="location.reload()">Reload</button></div></div>
    <script>
      if (location.protocol === 'file:') {
        document.addEventListener('DOMContentLoaded', function () {
          var el = document.getElementById('app') || document.body;
          el.textContent = 'Slope Tycoon cannot run from file://. Run "npm run preview" (or "npx serve dist") and open the printed http://localhost URL.';
          el.style.cssText = 'padding:24px;font:16px sans-serif;color:#fff;background:#222';
        });
      }
    </script>
    <script>
      /* Boot errors before / outside the module (failed import, throw during boot): never a blank splash. Removed once the splash is gone. */
      window.addEventListener('error', function (e) {
        var sp = document.getElementById('splash');
        if (!sp || sp.classList.contains('done') || sp.classList.contains('failed')) return;
        if (e && e.target && e.target !== window && e.target.tagName !== 'SCRIPT') return;
        sp.classList.add('failed');
        var b = document.getElementById('splash-bar'); if (b) b.hidden = true;
        var h = document.getElementById('splash-hint'); if (h) h.hidden = true;
        var t = document.getElementById('splash-text'); if (t) t.textContent = 'Something went wrong';
        var er = document.getElementById('splash-err'); if (er) { var p = er.querySelector('p'); if (p) p.textContent = 'The game could not start. Check your connection and reload.'; er.hidden = false; }
      }, true);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
